name: Generate publish-ready short

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema do vídeo"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "FIRST_RUN.md"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng curl fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Brazilian Portuguese neural voice
        run: |
          mkdir -p .cache/piper
          curl -L --fail --retry 3 \
            -o .cache/piper/pt_BR-faber-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx?download=true"
          curl -L --fail --retry 3 \
            -o .cache/piper/pt_BR-faber-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json?download=true"

      - name: Generate final publication package
        env:
          TOPIC: ${{ github.event.inputs.topic || '3 formas práticas de usar IA para economizar tempo no trabalho' }}
          TTS_MODEL: .cache/piper/pt_BR-faber-medium.onnx
        run: python -m app.main --topic "$TOPIC"

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: atalho-ia-publicacao
          path: output/
          retention-days: 7
          compression-level: 6
