name: Generate publish-ready short

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema do vídeo"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "FIRST_RUN.md"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng curl fonts-dejavu-core

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Download Brazilian Portuguese neural voice
        run: |
          mkdir -p .cache/piper
          curl -L --fail --retry 3 \
            -o .cache/piper/pt_BR-faber-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx?download=true"
          curl -L --fail --retry 3 \
            -o .cache/piper/pt_BR-faber-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/pt/pt_BR/faber/medium/pt_BR-faber-medium.onnx.json?download=true"

      - name: Generate final publication package
        env:
          TOPIC: ${{ github.event.inputs.topic || '3 formas práticas de usar IA para economizar tempo no trabalho' }}
          TTS_MODEL: .cache/piper/pt_BR-faber-medium.onnx
        run: python -m app.main --topic "$TOPIC"

      - name: Publish media to public repository path
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR=$(find output -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)
          PUB_DIR="publish/${GITHUB_RUN_ID}"
          mkdir -p "$PUB_DIR"
          cp "$RUN_DIR/video_publish.mp4" "$PUB_DIR/video_publish.mp4"
          cp "$RUN_DIR/cover.jpg" "$PUB_DIR/cover.jpg"
          cp "$RUN_DIR/post.txt" "$PUB_DIR/post.txt"
          cp "$RUN_DIR/captions.srt" "$PUB_DIR/captions.srt"
          cp "$RUN_DIR/metadata.json" "$PUB_DIR/metadata.json"

          printf '%s\n' "$GITHUB_RUN_ID" > publish/LATEST_RUN_ID.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish/
          git commit -m "media: publish run ${GITHUB_RUN_ID}"
          git push

      - name: Upload publication package
        uses: actions/upload-artifact@v4
        with:
          name: atalho-ia-publicacao
          path: output/
          retention-days: 7
          compression-level: 6
