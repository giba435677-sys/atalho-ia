name: Generate short video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Tema do vídeo"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "FIRST_RUN.md"

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and local voice
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate video
        env:
          TOPIC: ${{ github.event.inputs.topic || '3 formas práticas de usar IA para economizar 1 hora por dia no trabalho' }}
        run: python -m app.main --topic "$TOPIC"

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: atalho-ia-output
          path: output/
          retention-days: 7
